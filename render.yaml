services:
  - type: web
    name: nutrishield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NUTRISHIELD_DATABASE
        value: /tmp/nutrishield.sqlite3
